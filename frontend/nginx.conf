# LinguaVoice frontend in production: serves the static pages and proxies /api to the Spring Boot backend,
# so the browser only ever talks to one origin (same as frontend/dev-server.mjs in development).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Voice uploads are at most 10 MB (the backend enforces the same limit).
    client_max_body_size 10m;

    # Same policy as the dev server: scripts only from this origin, network calls only to this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Microphone only for this site; camera and location never.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same-origin calls: drop Origin so the backend doesn't treat them as cross-origin (no cookies are used).
        proxy_set_header Origin "";
        # Voice requests wait for speech recognition and translation.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
