# Test profile: in-memory H2 in MySQL compatibility mode. Flyway runs the real migrations against it.
spring:
  datasource:
    url: jdbc:h2:mem:linguavoice_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

app:
  cors:
    allowed-origins: http://localhost:5500
  jwt:
    secret: test-only-secret-not-used-anywhere-else-0123456789
    expiration-minutes: 60
  security:
    bcrypt-strength: 4   # minimum cost: keeps tests fast; production uses 12
