# LinguaVoice backend configuration.
# Secrets are NEVER written here. They come from environment variables or a local, git-ignored
# `.env` file (see `.env.example` in the repository root). Values after the colon are safe local defaults.

spring:
  application:
    name: linguavoice-backend
  config:
    # Loads KEY=value pairs from .env when running from either the repo root or the backend/ folder.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linguavoice_db?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:linguavoice}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    # Timestamps are LocalDateTime values that already hold UTC (entities use LocalDateTime.now(UTC)) and are
    # stored verbatim. Do NOT set hibernate.jdbc.time_zone: for LocalDateTime it converts through the JVM's
    # default zone, silently shifting every stored value by the server's UTC offset.

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Upper bound for voice uploads (enforced again in the voice service in Phase 4).
      max-file-size: ${MAX_AUDIO_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_AUDIO_UPLOAD_SIZE:10MB}

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

app:
  name: LinguaVoice
  version: '@project.version@'
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  jwt:
    # No default on purpose: the app refuses to start without a real secret.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: linguavoice
  security:
    bcrypt-strength: 12
  ai:
    translation:
      # azure | google | none. Without a provider and key, translation returns HTTP 503 (never fake output).
      provider: ${TRANSLATION_PROVIDER:none}
      api-key: ${TRANSLATION_API_KEY:}
      region: ${TRANSLATION_REGION:}
      endpoint: ${TRANSLATION_ENDPOINT:}
      timeout-seconds: 10
    speech-to-text:
      # azure | google | none. Without it, the browser's own speech recognition is offered as a fallback.
      provider: ${STT_PROVIDER:none}
      api-key: ${STT_API_KEY:}
      region: ${STT_REGION:}
      endpoint: ${STT_ENDPOINT:}
      timeout-seconds: 30
    text-to-speech:
      # azure | google | none. Without it, translations are read aloud with the browser's own voices.
      provider: ${TTS_PROVIDER:none}
      api-key: ${TTS_API_KEY:}
      region: ${TTS_REGION:}
      endpoint: ${TTS_ENDPOINT:}
      timeout-seconds: 30
  rate-limit:
    ai-requests-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:30}

logging:
  level:
    com.linguavoice: INFO
